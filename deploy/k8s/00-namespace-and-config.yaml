apiVersion: v1
kind: Namespace
metadata:
  name: redlining-studio
  labels:
    app.kubernetes.io/part-of: redlining-studio
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: redlining-studio-config
  namespace: redlining-studio
data:
  APP_ENV: "production"
  API_V1_PREFIX: "/api/v1"
  REDIS_URL: "redis://redlining-redis:6379/0"
  CELERY_BROKER_URL: "redis://redlining-redis:6379/0"
  CELERY_TASK_ALWAYS_EAGER: "false"
  CORS_ALLOWED_ORIGINS: '["https://redline.example.com"]'
  LLM_PROVIDER: "groq"
  LLM_MODEL_NAME: "llama-3.3-70b-versatile"
  LLM_TEMPERATURE: "0.0"
  REDLINE_BATCH_CONCURRENCY: "20"
  EMBEDDING_MODEL_NAME: "text-embedding-3-small"
  EMBEDDING_DIMENSION: "1536"
  STORAGE_ROOT_PATH: "/var/lib/redlining_studio/storage"
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "240"
  JWT_SECRET_KEY_FILE: "/run/secrets/jwt_secret_key"
  GROQ_API_KEY_FILE: "/run/secrets/groq_api_key"
  OPENAI_API_KEY_FILE: "/run/secrets/openai_api_key"
---
# NOTE: Populate actual production secret values via `kubectl create secret generic`
# or an ExternalSecrets / SealedSecrets controller before applying in production.
apiVersion: v1
kind: Secret
metadata:
  name: redlining-studio-secrets
  namespace: redlining-studio
type: Opaque
stringData:
  jwt_secret_key: "REPLACE_WITH_64_BYTE_CSPRNG_HEX_JWT_SECRET"
  groq_api_key: "REPLACE_WITH_PRODUCTION_GROQ_API_KEY"
  openai_api_key: "REPLACE_WITH_PRODUCTION_OPENAI_API_KEY"
  postgres_password: "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
  DATABASE_URL: "postgresql+asyncpg://redline_app:REPLACE_WITH_STRONG_POSTGRES_PASSWORD@redlining-postgres:5432/redlining_studio"

