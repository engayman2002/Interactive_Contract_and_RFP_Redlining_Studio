apiVersion: v1
kind: Service
metadata:
  name: redlining-frontend
  namespace: redlining-studio
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: redlining-frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redlining-frontend
  namespace: redlining-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redlining-frontend
  template:
    metadata:
      labels:
        app: redlining-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: frontend
          image: redlining-studio-frontend:0.2.0-beta
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redlining-studio-ingress
  namespace: redlining-studio
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - redline.example.com
      secretName: redlining-studio-tls-cert
  rules:
    - host: redline.example.com
      http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: redlining-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: redlining-frontend
                port:
                  number: 3000

